# The Cloudflare build (2026-11-05): a push to main builds the Next app through
# @opennextjs/cloudflare and deploys the worker named nsrgpt (wrangler.jsonc).
# Copied from NYSgpt's cloudflare-branch workflow. GitHub Actions runs it because
# the Workers Builds repo connection needs a dashboard click. Secrets:
# CLOUDFLARE_API_TOKEN (workers edit), CLOUDFLARE_ACCOUNT_ID. The build step sets NEXT_PUBLIC_DATA_BASE, the chart
# data's CloudFront domain (lib/data-url.ts, 2026-11-08): Next.js writes it into the browser code at build time.
name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # actions: read lets the build-numbers step below count this month's runs (2026-11-05).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.1.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: npx opennextjs-cloudflare build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_DATA_BASE: https://dcl3kyt3ynmb2.cloudfront.net
      # The right panel's Cloudflare view reads this deploy's numbers from /build-usage.json (2026-11-05):
      # GitHub Actions minutes this repo used this month, static files, and the bundled worker size.
      - name: Record this deploy's build numbers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MONTH=$(date -u +%Y-%m-01)
          gh api --paginate "repos/${{ github.repository }}/actions/runs?created=%3E%3D${MONTH}&status=completed&per_page=100" \
            -q '.workflow_runs[] | (((.updated_at | fromdate) - (.run_started_at | fromdate)) / 60 | ceil)' > minutes.txt || true
          MIN=$(awk '{s+=$1} END {print s+0}' minutes.txt)
          RUNS=$(wc -l < minutes.txt | tr -d ' ')
          KIB=$(npx wrangler deploy --dry-run --outdir .wrangler-dry 2>&1 | sed -n 's/.*Total Upload: \([0-9.]*\) KiB.*/\1/p' | head -1)
          FILES=$(( $(find .open-next/assets -type f | wc -l) + 1 ))
          printf '{"month":"%s","buildMinutes":%s,"runs":%s,"assetFiles":%s,"workerKiB":%s,"builtAt":"%s","commit":"%s"}\n' \
            "$MONTH" "$MIN" "$RUNS" "$FILES" "${KIB:-0}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA::7}" > .open-next/assets/build-usage.json
          cat .open-next/assets/build-usage.json
      - run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
